# Flatpak manifest for the single-file bundle attached to every GitHub release
# (downloadcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (downloadcraft-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh) instead of compiling Rust inside
# flatpak-builder: no network and no vendored crate sources during the build, a few seconds
# instead of 20+ minutes, and byte-for-byte the same binaries as the AppImage/deb/rpm. The script
# unpacks the tarball into `stage/` next to a copy of this file. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all
# of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# ai.storyteller.downloadcraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.downloadcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: downloadcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Downloading: DownloadCraft talks to the servers the user points it at.
  - --share=network
  # Downloads land in the Downloads folder by default; another folder is picked through the
  # file-chooser portal (rfd), which grants access to just that folder.
  - --filesystem=xdg-download
  # Deliberately not granted: home/host filesystem access and sound. The download list lives in
  # the sandbox's own data folder (~/.var/app/ai.storyteller.downloadcraft/data/DownloadCraft).
modules:
  - name: downloadcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/downloadcraft /app/bin/downloadcraft
      - install -Dm755 bin/downloadcraft-cli /app/bin/downloadcraft-cli
      - install -Dm644 share/applications/ai.storyteller.downloadcraft.desktop /app/share/applications/ai.storyteller.downloadcraft.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.downloadcraft.metainfo.xml /app/share/metainfo/ai.storyteller.downloadcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/downloadcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
