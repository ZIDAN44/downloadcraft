[package]
name = "downloadcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "DownloadCraft desktop app"
default-run = "downloadcraft"

[lints]
workspace = true

[dependencies]
downloadcraft-engine = { workspace = true }
downloadcraft-net = { workspace = true }
downloadcraft-ui-egui = { workspace = true }
# Without default features, so each is named: "clipboard" is copy and paste (pasting a link).
eframe = { workspace = true, features = ["clipboard", "default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The system's Downloads folder and where the list is kept.
dirs = "6"
# The folder picker.
rfd = "0.17"
# Open finished files and folders with the system's default app.
open = "5"
# Decodes the window icon (assets/app-icon).
image = { version = "0.25", default-features = false, features = ["png"] }
# The single-instance key, from the system's secure random source (already the network crate's).
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# One DownloadCraft per data folder (`single_instance.rs`): Unix sockets on Windows, which std lacks.
uds_windows = "1.2"

[build-dependencies]
# Icon + VERSIONINFO for downloadcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
